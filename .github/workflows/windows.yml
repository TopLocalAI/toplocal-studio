# Windows x64 installer (NSIS). macOS builds are made locally with packaging/build_macos.sh.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "service/**", "packaging/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["app/**", "service/**", "packaging/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: astral-sh/setup-uv@v6

      - name: Cache engine downloads
        uses: actions/cache@v4
        with:
          path: .cache/windows-engines
          key: windows-engines-${{ hashFiles('packaging/windows-engines.json') }}

      - name: Bundle Python runtime and engines
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Smoke test
        shell: pwsh
        run: ./packaging/smoke_windows.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: TopLocal-Studio-windows-x64
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Direct download links on Cloudflare R2: one per build, plus a "latest" copy for main.
      - name: Upload installer to R2
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $sha = "${{ github.sha }}".Substring(0, 7)
          $build = "toplocal-studio/windows/TopLocal-Studio-$version-$sha-x64-setup.exe"
          $keys = @($build)
          if ("${{ github.ref }}" -eq "refs/heads/main") { $keys += "toplocal-studio/windows/TopLocal-Studio-latest-x64-setup.exe" }
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $keys += "toplocal-studio/windows/TopLocal-Studio-${{ github.ref_name }}-x64-setup.exe" }
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          foreach ($key in $keys) {
            aws s3 cp $exe.FullName "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT --content-type application/octet-stream --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
            "- $env:R2_PUBLIC_URL/$key" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" $exe.FullName --draft --title "TopLocal Studio ${{ github.ref_name }}" --generate-notes
          } else {
            gh release upload "${{ github.ref_name }}" $exe.FullName --clobber
          }
