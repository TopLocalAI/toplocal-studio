# Windows x64 installer (NSIS). macOS builds are made locally with packaging/build_macos.sh.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "service/**", "packaging/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["app/**", "service/**", "packaging/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: astral-sh/setup-uv@v6

      - name: Cache engine downloads
        uses: actions/cache@v4
        with:
          path: .cache/windows-engines
          key: windows-engines-${{ hashFiles('packaging/windows-engines.json') }}

      - name: Bundle Python runtime and engines
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Smoke test
        shell: pwsh
        run: ./packaging/smoke_windows.ps1

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: TopLocal-Studio-windows-x64
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" $exe.FullName --draft --title "TopLocal Studio ${{ github.ref_name }}" --generate-notes
          } else {
            gh release upload "${{ github.ref_name }}" $exe.FullName --clobber
          }
