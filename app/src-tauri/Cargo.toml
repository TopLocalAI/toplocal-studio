[package]
name = "toplocal-studio"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/TopLocalAI/toplocal-studio"
description = "TopLocal Studio — image, video, music and speech generation on your own computer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "toplocal_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
getrandom = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
