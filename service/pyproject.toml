[project]
name = "localai-service"
version = "0.1.0"
description = "Local inference service for TopLocal Studio (image, video, music, speech)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "cn2an>=0.5.24",
    "pillow>=12.3.0",
]

[project.scripts]
localai-service = "localai_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localai_service"]
